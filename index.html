<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWÖSAINTS</title>
<meta name="description" content="TWÖSAINTS · DJ · André dos Santos · EDM &amp; Brazilian Music">
<meta property="og:image" content="portrait.jpg">
<link rel="icon" href="mark.png">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,400;1,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--obsidian:#0B0A0C;--bone:#F2EEE6;--gold:#C9A24B;--pewter:#A8A5A8;--line:rgba(242,238,230,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--obsidian);color:var(--bone);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;position:relative}

  /* HERO */
  .hero{position:relative;height:78vh;min-height:520px;max-height:760px;overflow:hidden}
  .hero .bg{width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,10,12,.35) 0%,rgba(11,10,12,0) 25%,rgba(11,10,12,0) 55%,var(--obsidian) 100%)}

  /* IDENTITY */
  .logo{position:sticky;top:0;z-index:5;margin-top:-120px;padding:12px 24px 22px;text-align:center}
  .logo::before{content:"";position:absolute;inset:0 0 -30px;z-index:-1;transform-origin:top;
    background:linear-gradient(var(--obsidian) 40%,rgba(11,10,12,.7) 70%,rgba(11,10,12,0))}
  .id{text-align:center;padding:0 24px;position:relative;z-index:2}
  .wordmark{width:100%;max-width:360px;vertical-align:middle;filter:drop-shadow(0 4px 24px rgba(0,0,0,.6))}
  /* backdrop fades in over the last 200px before the logo pins (pin point = hero height - 120px).
     Browsers without scroll timelines just show the backdrop always. */
  @supports (animation-timeline:scroll()){
    .logo::before{animation:backdrop linear both;animation-timeline:scroll();
      animation-range:calc(clamp(520px,78vh,760px) - 320px) calc(clamp(520px,78vh,760px) - 120px)}
    @keyframes backdrop{from{opacity:0}to{opacity:1}}
  }
  .tag{font-family:'Bodoni Moda',serif;font-style:italic;font-size:19px;color:var(--bone);margin-top:14px}
  .meta{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--pewter);margin-top:10px}

  /* LINKS */
  .links{display:flex;flex-direction:column;gap:12px;padding:34px 24px 8px}
  .links a{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 20px;
    border:1px solid var(--line);border-radius:2px;color:var(--bone);text-decoration:none;
    font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    background:rgba(242,238,230,.03);transition:background .25s,border-color .25s,color .25s}
  .links a{background:var(--gold);border-color:var(--gold);color:var(--obsidian)}
  .links a:hover{background:rgb(23,12,30);color:var(--bone)}
  .links a{flex-direction:column;gap:4px;padding:16px 20px}.links a small{font-size:10px;letter-spacing:.3em;opacity:.65}
  .links a b{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:700;font-size:30px;letter-spacing:.04em;line-height:1}
  .links a:hover b{color:var(--gold)}
  .links a span{font-size:16px;font-weight:600;letter-spacing:.16em}
  .sc{color:var(--bone);display:inline-block;transition:color .2s}.sc:hover{color:var(--gold)}.sc svg{width:40px;height:40px;fill:currentColor;vertical-align:middle}.sc+.sc{margin-left:22px}.sc .ig{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2}

  /* SOCIAL */
  .social{display:flex;justify-content:center;gap:26px;padding:26px 0 10px}
  .social a{color:var(--pewter);transition:color .2s}
  .social a:hover{color:var(--bone)}
  .social svg{width:22px;height:22px;fill:currentColor}

  /* DIVIDER */
  .div{display:flex;align-items:center;gap:14px;padding:38px 24px 0;color:var(--pewter)}
  .div::before,.div::after{content:"";flex:1;height:1px;background:var(--line)}
  .div span{font-size:10px;letter-spacing:.4em;text-transform:uppercase}

  /* FORM */
  form{padding:22px 24px 0}
  h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:34px;line-height:1.05;margin-bottom:6px}
  h2 em{color:var(--gold);font-style:italic}
  .sub{color:var(--pewter);font-size:14px;margin-bottom:22px}
  label{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--pewter);margin:16px 0 8px}
  input,textarea,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
    color:var(--bone);font:inherit;font-size:16px;padding:8px 0;outline:none;border-radius:0}
  select option{background:var(--obsidian)}
  input:focus,textarea:focus,select:focus{border-bottom-color:var(--bone)}
  textarea{resize:vertical;min-height:80px}
  button{margin-top:28px;width:100%;min-height:56px;background:var(--bone);color:var(--obsidian);border:0;border-radius:2px;
    font:inherit;font-weight:600;font-size:13px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
  button:hover{background:var(--gold);color:var(--obsidian)}

  footer{text-align:center;padding:56px 24px 40px}
  footer img{display:block;margin:28px auto 0;width:30px;opacity:.5}
  footer p{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#5d5a5e;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="bg" src="portrait.jpg" alt="TWÖSAINTS portrait">
  </header>

  <div class="logo"><img class="wordmark" src="wordmark.png" alt="TWÖSAINTS"></div>
  <section class="id">
    <p class="meta">DJ · André dos Santos</p>

    <img src="mark.png" alt="">
    <p>© TWÖSAINTS</p>
  </footer>
</div>
</body>
</html>
